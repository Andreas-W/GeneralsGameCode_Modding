name: Weekly Release

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      build_notes:
        description: 'Build notes (optional)'
        required: false
        default: ''
        type: string
      known_issues:
        description: 'Known issues (optional)'
        required: false
        default: ''
        type: string
      force_changed:
        description: 'Force build'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      pre-release:
        description: 'Mark release as pre-release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      create_release:
        description: 'Create a GitHub release (false = only build, e.g. to test the workflow)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

  schedule:
    - cron: '0 9 * * 5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-date:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

  detect-scm-changes:
    needs: [get-date]
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: check
        run: |
          if [ "${{ github.event.inputs.force_changed }}" = "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo LAST TAG:
          git describe --tags --abbrev=0 2>/dev/null || echo ""

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          CHANGED=$(git diff --name-only $LAST_TAG..HEAD | grep -v '.github/workflows/' | wc -l)
          if [ "$CHANGED" -eq "0" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  # The mod code needs a modern compiler (VC6 can't build it), so the weekly build uses the
  # win32 preset (VS2022, x86, Release) and only builds GeneralsZH and WorldBuilderZH.
  build-generalsmd:
    needs: [detect-scm-changes, get-date]
    if: needs.detect-scm-changes.outputs.changed == 'true'
    name: Build GeneralsMD
    uses: ./.github/workflows/build-toolchain.yml
    with:
      game: "GeneralsMD"
      preset: "win32"
      tools: true   # needed so the WorldBuilder target is configured
      extras: false
      targets: "z_generals z_worldbuilder"
    secrets: inherit

  create-release:
    name: Create Release
    needs: [build-generalsmd, get-date]
    if: github.event.inputs.create_release != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Collect commits since last release
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            CHANGELOG_COMMITS=$(git log --pretty="format:- %s" --no-merges HEAD | head -n 10 || true)
          else
            CHANGELOG_COMMITS=$(git log --pretty="format:- %s" --no-merges "$LAST_TAG"..HEAD || true)
          fi
          if [ -z "$CHANGELOG_COMMITS" ]; then
            CHANGELOG_COMMITS="- No relevant changes detected since the last release."
          fi
          {
            echo 'commits<<CHANGELOG_EOF'
            echo "$CHANGELOG_COMMITS"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      # GeneralsMD win32 (generalszh.exe + WorldBuilderZH.exe)
      - name: Download GeneralsMD Artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: GeneralsMD-win32+t
          path: generalsmd-artifacts

      - name: Prepare and Zip GeneralsMD
        run: |
          ls -la generalsmd-artifacts
          zip -jr generalszh-weekly-${{ needs.get-date.outputs.date }}.zip generalsmd-artifacts/*

      - name: Generate release notes
        id: release_body
        run: |
          BODY=""
          if [ "${{ github.event.inputs.build_notes }}" != "" ]; then
            BODY="${BODY}### Build notes\n${{ github.event.inputs.build_notes }}\n"
          fi
          if [ "${{ github.event.inputs.known_issues }}" != "" ]; then
            BODY="${BODY}### Known issues\n${{ github.event.inputs.known_issues }}\n"
          fi
          BODY="${BODY}### Changelog\n${{ steps.changelog.outputs.commits }}"
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo -e "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: weekly-${{ needs.get-date.outputs.date }}
          name: weekly-${{ needs.get-date.outputs.date }}
          prerelease: ${{ github.event.inputs.pre-release == 'true' }}
          body: ${{ steps.release_body.outputs.body }}
          files: |
            generalszh-weekly-${{ needs.get-date.outputs.date }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up release folders
        if: always()
        run: |
          rm -rf generalsmd-artifacts
          rm -f generalszh-weekly-${{ needs.get-date.outputs.date }}.zip
